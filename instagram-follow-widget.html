<!--
  Instagram Follow Widget for Squarespace
  HOW TO USE:
  1. In Squarespace, add a "Code Block" (or embed block set to code) where you want this to appear.
  2. Paste this entire snippet into it.
  3. Edit the 3 values marked "EDIT ME" below: your @handle, your profile URL, and the follower count.
  4. Whenever your follower count changes, come back and update the FOLLOWER_COUNT number.

  FONT NOTE: This uses Garamond Pro, which is a licensed font (not a free
  web font like Google Fonts) — it will only display if the visitor's
  device already has it installed, OR if you load it site-wide via
  Squarespace's Design > Fonts > Adobe Fonts (Typekit) integration using
  "Adobe Garamond Pro". Otherwise it silently falls back to the next font
  in the stack (EB Garamond, a free lookalike, then a generic serif) so
  the widget still looks intentional either way.
-->

<div class="ig-follow-widget">
  <a
    href="https://www.instagram.com/YOUR_USERNAME/"
    target="_blank"
    rel="noopener noreferrer"
    class="ig-follow-link"
    aria-label="Follow us on Instagram"
  >
    <svg class="ig-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="4.6" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
    </svg>

    <span class="ig-text">
      <span class="ig-handle">@your_username</span>
      <span class="ig-count"><span class="ig-count-number">12.4K</span> followers</span>
    </span>

    <span class="ig-cta">Follow</span>
  </a>
</div>

<style>
  .ig-follow-widget {
    display: flex;
    justify-content: center;
    margin: 24px 0;
    font-family: "Adobe Garamond Pro", "Garamond Premier Pro", "EB Garamond", Garamond, Georgia, serif;
  }

  .ig-follow-link {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    color: #ffffff;
    background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .ig-follow-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .ig-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    color: #ffffff;
  }

  .ig-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .ig-handle {
    font-weight: 600;
    font-size: 14px;
  }

  .ig-count {
    font-size: 12px;
    opacity: 0.9;
  }

  .ig-count-number {
    font-weight: 700;
  }

  .ig-cta {
    margin-left: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.2);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 420px) {
    .ig-follow-link {
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }
    .ig-cta {
      margin-left: 0;
    }
  }
</style>
